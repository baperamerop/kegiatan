<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:system-ui;color:#183346;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}header{background:#123d50;color:white;padding:24px 5%;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}small{opacity:.75}main{max-width:1400px;margin:30px auto;padding:0 24px}button,input,select{padding:11px;border:1px solid #ccd7dd;border-radius:7px;font:inherit}button{cursor:pointer;background:#146d74;color:white}button:disabled{opacity:.5}input,select{background:white}nav,.filters{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.card{background:white;border:1px solid #dce5e9;border-radius:12px;padding:20px}.card strong{display:block;font-size:25px;margin-top:12px}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:left;padding:15px;border-bottom:1px solid #e3eaee}th{font-size:12px;text-transform:uppercase;color:#536b79}.scroll{overflow:auto;border-radius:10px}td.money{white-space:nowrap;text-align:right}a{color:#087b84}#login{max-width:420px;margin:12vh auto}#login input{width:100%;margin:20px 0}#message{white-space:pre-wrap;margin:16px 0;color:#8b4e0a}dialog{border:0;border-radius:12px;max-width:1000px;width:90%}dialog::backdrop{background:#123d5088}.child{padding-left:36px}label{display:block}button.link{background:none;color:#146d74;border:0;padding:0;text-align:left}p{line-height:1.6}
</style><header><h1>Monitoring Kegiatan</h1><button onclick="sessionStorage.clear();location.reload()">Keluar</button></header><main><section id="login" class="card"><form onsubmit="enter(event)"><h2>Masuk</h2><input id="password" type="password" required placeholder="Password"><button>Masuk</button></form></section><p id="message" role="status"></p><section id="app" hidden><nav><button onclick="view='summary';render()">Rekap</button><button onclick="view='mapping';render()">Label transaksi</button><button onclick="view='activities';render()">Kegiatan</button><button onclick="run('refresh')">Perbarui Data</button><button onclick="importOctober()">Impor label Oktober</button></nav><small id="asof"></small><div class="filters"><input id="search" placeholder="Cari" oninput="render()"><select id="unit" onchange="render()"><option value="">Semua unit</option></select><select id="month" onchange="render()"><option value="">Semua bulan kegiatan</option><option value="none">Belum Diisi</option></select><select id="status" onchange="render()"><option value="">Semua status</option><option>Sudah dibukukan</option><option>Dalam proses</option><option>Perlu ditinjau</option></select><select id="order" onchange="render()"><option value="unit">UNIT → Kegiatan</option><option value="activity">Kegiatan → UNIT</option></select></div><div id="content"></div></section></main><script>
const SEED=[];
let token=sessionStorage.getItem('mk-session')||'',state={activities:[],transactions:[]},view='summary';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),rp=v=>new Intl.NumberFormat('id-ID',{maximumFractionDigits:2}).format(v);
const API_URL="https://script.google.com/macros/s/AKfycbxx8fGtfKy-pYeO6M9WzkZUbSRUy-O_aw7AUhe8DrQTpt5JWKM5nFjoGH5ORV9u_oaD/exec";
function rpc(action,...args){return new Promise((resolve,reject)=>{const nonce=crypto.randomUUID(),frame=document.createElement('iframe'),form=document.createElement('form');frame.name='mk_'+nonce.replaceAll('-','');frame.hidden=true;form.hidden=true;form.method='POST';form.action=API_URL;form.target=frame.name;for(const [k,v] of Object.entries({action,args:JSON.stringify(args),nonce,origin:location.origin})){const input=document.createElement('textarea');input.name=k;input.value=v;form.appendChild(input)}let settled=false;const timer=setTimeout(()=>done(new Error('Backend belum merespons setelah 180 detik. Muat ulang untuk memeriksa hasil sebelum mencoba kembali.')),180000);function done(err,value){if(settled)return;settled=true;clearTimeout(timer);window.removeEventListener('message',receive);form.remove();frame.remove();err?reject(err):resolve(value)}function receive(e){const d=e.data;if(!/^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(e.origin)&&e.origin!=='https://script.google.com')return;if(!d||d.channel!=='monitoring-kegiatan-rpc'||d.nonce!==nonce)return;d.response?.ok?done(null,d.response.value):done(new Error(d.response?.error||'Respons tidak valid'))}window.addEventListener('message',receive);document.body.append(frame,form);form.submit()})}
function importOctober(){if(!state.sources?.OCT||!state.transactions.some(t=>t.month===10&&!t.missing)){$('message').textContent='Data Oktober belum tersedia. Klik Perbarui Data dahulu. Jika pembaruan OCT gagal, periksa pesan kesalahannya.';return}run('importOctoberSeed')}
async function enter(e){e.preventDefault();try{token=await rpc('login',$('password').value);$('password').value='';sessionStorage.setItem('mk-session',token);await run('data')}catch(e){$('message').textContent=e.message}}
async function run(name,...args){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{state=await rpc(name,token,...args);$('login').hidden=true;$('app').hidden=false;const u=$('unit').value;$('unit').innerHTML='<option value="">Semua unit</option>'+[...new Set(state.transactions.map(t=>t.unit))].sort().map(u=>`<option>${esc(u)}</option>`).join('');$('unit').value=u;render()}catch(e){$('message').textContent=e.message}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
$('month').innerHTML+=Array.from({length:12},(_,i)=>`<option value="${String(i+1).padStart(2,'0')}">${new Date(2026,i,1).toLocaleString('id-ID',{month:'long'})}</option>`).join('');
function activity(id){return state.activities.find(a=>a.id===id)}
function date(t){const a=activity(t.activity);return t.date||a?.date||activity(a?.parent)?.date||''}
function list(){const q=$('search').value.toLowerCase();return state.transactions.filter(t=>!t.missing&&(!$('unit').value||t.unit===$('unit').value)&&(!$('month').value||($('month').value==='none'?!date(t):date(t).slice(5,7)===$('month').value))&&(!$('status').value||t.statusGroup===$('status').value)&&[t.proof,t.description,activity(t.activity)?.name,activity(activity(t.activity)?.parent)?.name].join(' ').toLowerCase().includes(q))}
function totals(ts){return ['Jaldis','Non-Jaldis','BBO','Perlu ditinjau'].map(k=>ts.filter(t=>t.type===k).reduce((s,t)=>s+t.main+t.tax,0)).concat(ts.reduce((s,t)=>s+t.main+t.tax,0))}
function render(){const ts=list();$('asof').textContent='Pembaruan: '+(state.updatedAt||'Belum ada');$('message').textContent=[...(state.errors||[]),state.importResult||'',state.transactions.filter(t=>t.missing).length+' transaksi hilang dari sumber (dikecualikan dari rekap).'].join('\n');if(view==='activities'){renderActivities();return}if(view==='mapping'){renderMapping(ts);return}const groups=new Map();ts.forEach(t=>{const a=activity(t.activity),p=activity(a?.parent),parts=[t.unit||'Belum diisi',p?.name||a?.name||'Belum dipetakan',p?a.name:'Langsung pada induk'];if($('order').value==='activity')parts.push(parts.shift());for(let i=1;i<=3;i++){const key=JSON.stringify(parts.slice(0,i));if(!groups.has(key))groups.set(key,[]);groups.get(key).push(t)}});$('content').innerHTML='<div class="cards">'+['Sudah dibukukan','Dalam proses','Perlu ditinjau'].map(k=>`<div class="card">${k}<strong>${rp(ts.filter(t=>t.statusGroup===k).reduce((s,t)=>s+t.main+t.tax,0))}</strong></div>`).join('')+'</div><p>Klik kelompok untuk rincian. Subtotal mencakup turunannya; total akhir menghitung setiap transaksi sekali.</p><div class="scroll"><table><thead><tr><th>Kelompok</th>'+['Jaldis','Non-jaldis','BBO','Jenis perlu ditinjau','Total'].map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>'+[...groups].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>`<tr><td><details><summary>${esc(JSON.parse(k).join(' → '))}</summary>${table(v)}</details></td>${totals(v).map(x=>`<td class="money">${rp(x)}</td>`).join('')}</tr>`).join('')+'</tbody><tfoot><tr><th>Total</th>'+totals(ts).map(x=>`<th>${rp(x)}</th>`).join('')+'</tr></tfoot></table></div>'}
function table(ts,check=false){return '<table><tr><th>Bukti / Uraian</th><th>Unit / Kegiatan</th><th>Tanggal kegiatan / Bulan BKU</th><th>Jenis / Status</th><th>Utama + pajak = total</th></tr>'+ts.map(t=>`<tr><td>${check?`<input type="checkbox" name="tx" value="${esc(t.id)}">`:''}<details><summary>${esc(t.proof)}</summary>${esc(t.description)}<p>${esc(t.mak)}</p><a target="_blank" rel="noopener" href="https://docs.google.com/spreadsheets/d/1ELhJkCQWAad0Uwu1o_TAvGg3UTnL3Aam9wxBhVghyMI/edit#range=${['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][t.month-1]}!A${t.row}">Sumber baris ${t.row}</a></details></td><td>${esc(t.unit)} / ${esc(activity(t.activity)?.name||'Belum dipetakan')}</td><td>${esc(date(t)||'Belum Diisi')} / ${t.month}</td><td>${esc(t.type)} / ${esc(t.statusGroup)}<br>${esc(t.status)}</td><td>${rp(t.main)} + ${rp(t.tax)} = ${rp(t.main+t.tax)}</td></tr>`).join('')+'</table>'}
function options(){return state.activities.map(a=>`<option value="${esc(a.id)}">${esc((activity(a.parent)?.name?activity(a.parent).name+' → ':'')+a.name)}</option>`).join('')}
function renderMapping(ts){$('content').innerHTML=`<p>Pilih transaksi; centang hanya bidang yang ingin diubah. Tanggal kosong mengembalikan tanggal warisan.</p><label><input id="setActivity" type="checkbox"> Ubah kegiatan <select id="target"><option value="">Batalkan pemetaan</option>${options()}</select></label><label><input id="setUnit" type="checkbox"> Ubah unit <input id="newUnit"></label><label><input id="setDate" type="checkbox"> Ubah tanggal khusus <input id="newDate" type="date" min="2026-01-01" max="2026-12-31"></label><button onclick="saveLabels()">Simpan pilihan</button><label><input id="onlyNew" type="checkbox" onchange="document.getElementById('txTable').innerHTML=table(list().filter(t=>!this.checked||!t.activity),true)"> Hanya belum dipetakan</label><div id="txTable" class="scroll">${table(ts,true)}</div>`}
function saveLabels(){const ids=[...document.querySelectorAll('[name=tx]:checked')].map(x=>x.value),p={};if($('setActivity').checked)p.activity=$('target').value;if($('setUnit').checked)p.unit=$('newUnit').value;if($('setDate').checked)p.date=$('newDate').value;if(ids.length&&Object.keys(p).length)run('labelTransactions',ids,p)}
function renderActivities(){ $('content').innerHTML=`<h2>Kegiatan dan subkegiatan</h2><select id="editId" onchange="fillActivity()"><option value="">Tambah baru</option>${options()}</select><p><input id="name" placeholder="Nama kegiatan"></p><label>Induk <select id="parent"><option value="">Kegiatan induk</option>${state.activities.filter(a=>!a.parent).map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select></label><label>Mulai <input id="start" type="date" min="2026-01-01" max="2026-12-31"></label><label>Selesai (opsional) <input id="end" type="date" min="2026-01-01" max="2026-12-31"></label><p>Subkegiatan tanpa tanggal mengikuti induk. Tanggal mulai menentukan bulan rekap.</p><button onclick="run('saveActivity',{id:$('editId').value,name:$('name').value,parent:$('parent').value,date:$('start').value,end:$('end').value})">Simpan kegiatan</button>`}
function fillActivity(){const a=activity($('editId').value)||{};$('name').value=a.name||'';$('parent').value=a.parent||'';$('start').value=a.date||'';$('end').value=a.end||''}
if(token)run('data');
</script></html>
